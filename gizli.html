<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="text-scale" content="scale" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light" />
<title>Modeller</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<!-- Eski yönetici paneli adresi (gizli.html / gizli-foto.html). 2026-11'den beri şifre kapısı yok: tüm modeller herkese
     açık model sayfalarında (yalnız görüntüleme ve ölçüm). Bu sayfa yalnız model listesine yönlendirir. -->
<script src="/admin-models.js"></script>
<link rel="stylesheet" href="/fonts/fonts.css?v=20261112" />
<link rel="stylesheet" href="/tokens.css?v=20261112" />
<link rel="stylesheet" href="/doc.css?v=20261112" />
<style>
  main { width:min(100% - 2 * var(--gut), 760px); margin:0 auto; padding:clamp(48px,9vw,110px) 0 64px; }
  h1 { font:300 clamp(2.4rem,7vw,4.4rem)/1 var(--serif); letter-spacing:-.032em; margin-bottom:16px; }
  p { color:var(--fg2); margin-bottom:clamp(24px,4vw,40px); max-width:56ch; }
  ul { list-style:none; margin:0; padding:0; border-top:1px solid var(--fg); counter-reset:m; }
  li { counter-increment:m; border-bottom:1px solid var(--rule); }
  li a { display:flex; align-items:baseline; gap:18px; padding:13px 0; font:400 1.16rem/1.3 var(--serif); letter-spacing:-.01em; transition:color .3s ease, padding-left .5s var(--ease); }
  li a::before { content:counter(m, decimal-leading-zero); font:400 .74rem/1 var(--mono); color:var(--fg3); min-width:1.9em; }
  li a:hover { color:var(--acct); padding-left:.4em; }
  .home { margin-top:28px; }
</style>
</head>
<body>
<main>
  <h1 data-l="Tüm modeller" data-e="All models">Tüm modeller</h1>
  <p data-l="Yönetici paneli kaldırıldı: tüm modeller herkese açık model sayfalarında görüntülenir." data-e="The admin panel has been retired: all models are shown on their public model pages.">Yönetici paneli kaldırıldı: tüm modeller herkese açık model sayfalarında görüntülenir.</p>
  <ul id="list"></ul>
  <a class="dback home" href="/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11.2M8.8 3.6 13.2 8l-4.4 4.4"/></svg><span data-l="Ana sayfa" data-e="Home page">Ana sayfa</span></a>
</main>
<script>
  (function () {
    var en = false; try { en = localStorage.getItem('lang') === 'en'; } catch (e) {}
    document.documentElement.lang = en ? 'en' : 'tr';
    document.querySelectorAll('[data-l]').forEach(function (n) { n.textContent = en ? n.dataset.e : n.dataset.l; });
    var ms = (window.ADMIN_MODELS && window.ADMIN_MODELS.models) || {}, ul = document.getElementById('list');
    Object.keys(ms).forEach(function (s) {
      var a = document.createElement('a'); a.href = ms[s].page; a.textContent = ms[s].title;
      var li = document.createElement('li'); li.append(a); ul.append(li);
    });
  })();
</script>
</body>
</html>
