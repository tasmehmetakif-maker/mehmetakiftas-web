<style>
  /* ===== 404 — haritada olmayan pafta ===== */
  body { min-height:100svh; display:flex; flex-direction:column; }
  main { position:relative; flex:1; display:flex; align-items:flex-end; overflow:hidden; padding:clamp(80px,12vh,140px) 0 clamp(30px,6vh,64px);
         --code:clamp(8.4rem,4rem + 18vw,21rem); --tsz:min(128vmin,1080px); }
  /* Eğriler yalnız zirve çevresinde görünür, dışa doğru solar: yazıların üstünden çizgi geçmez. */
  /* Halkalar "404"ün sağında kalır: görünen en sol halka = merkez − 0,307 × boyut; merkez rakamın sağ kenarından
     (sol boşluk + 1,45 × yazı boyu) en az 24 px uzağa itilir. Yazı büyüdükçe (metin ölçeği) halkalar da sağa kayar. */
  .topo { position:absolute; left:max(58%, calc(50% - min(50% - var(--gut), 560px) + 1.45 * var(--code) + 24px + .307 * var(--tsz))); top:44%; width:var(--tsz); height:var(--tsz); transform:translate(-50%,-50%); pointer-events:none;
          -webkit-mask-image:radial-gradient(circle closest-side at 60.3% 43.3%, #000 0, #000 34%, transparent 82%); mask-image:radial-gradient(circle closest-side at 60.3% 43.3%, #000 0, #000 34%, transparent 82%); }
  @media (max-width:760px) { .topo { left:62%; top:23%; } }
  .topo path { fill:none; stroke:var(--fg); stroke-width:1; vector-effect:non-scaling-stroke; opacity:.3; }
  .topo path.idx { opacity:.6; stroke-width:1.5; }
  @media (prefers-reduced-motion:no-preference) { .js .topo path { stroke-dasharray:1; stroke-dashoffset:1; animation:draw 2.4s var(--ease) forwards; animation-delay:calc(var(--k) * 90ms); } }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .topo circle { fill:var(--accent); }
  .box { position:relative; }
  .code { font:300 var(--code)/.8 var(--serif); letter-spacing:-.06em; margin-left:-.05em; font-variant-numeric:lining-nums; }
  .box .dlbl { display:flex; gap:14px; margin-bottom:clamp(24px,3.4vw,50px); }
  .box .dlbl .dmono { color:var(--acct); }
  h1 { font:400 clamp(1.5rem,3vw,2.3rem)/1.15 var(--serif); letter-spacing:-.018em; margin:clamp(20px,3vw,34px) 0 10px; padding-top:clamp(18px,2.4vw,28px); border-top:1px solid var(--fg); }
  .box p { color:var(--fg2); max-width:54ch; }
  .links { display:flex; flex-wrap:wrap; gap:10px; margin:clamp(20px,3vw,30px) 0 0; }
  .lang { margin-top:22px; font-size:.84rem; color:var(--fg2); }
</style>
</head>
<body>
  <header class="dtop"><div class="dwrap">
    <a class="dbrand" href="/" aria-label="Mehmet Akif Taş">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2.2 16.3 15.2H1.7Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="10.8" r="1.7" fill="currentColor"/></svg>
      Mehmet Akif Taş
    </a>
  </div></header>
  <main>
    <svg class="topo" id="topo" viewBox="-300 -300 600 600" aria-hidden="true"></svg>
    <div class="dwrap box">
      <div class="dlbl drise" style="--i:0"><span class="dmono">404</span><span data-l="Pafta dışı" data-e="Off the map">Pafta dışı</span></div>
      <div class="code drise" style="--i:1">404</div>
      <h1 class="drise" style="--i:2" data-l="Bu sayfa bulunamadı" data-e="Page not found">Bu sayfa bulunamadı</h1>
      <p class="drise" style="--i:3" data-l="Aradığınız sayfa taşınmış veya hiç var olmamış olabilir. Aşağıdan ana sayfaya dönebilirsiniz." data-e="The page you are looking for may have been moved or may never have existed. Use the links below to return to the homepage.">Aradığınız sayfa taşınmış veya hiç var olmamış olabilir. Aşağıdan ana sayfaya dönebilirsiniz.</p>
      <div class="links drise" style="--i:4">
        <a class="dbtn dbtn--solid" href="/" data-l="Akademik Portföy" data-e="Academic Portfolio">Akademik Portföy</a>
        <a class="dbtn" href="/otlukbeli/" data-l="Otlukbeli Gölü 3B" data-e="Otlukbeli Lake in 3D">Otlukbeli Gölü 3B</a>
        <a class="dbtn" href="/yayinlar.html" data-l="Yayınlar" data-e="Publications">Yayınlar</a>
      </div>
      <div class="lang drise" style="--i:5" id="other" lang="en" data-l="Page not found — use the links above to return to the homepage." data-e="Sayfa bulunamadı — ana sayfaya dönmek için yukarıdaki bağlantıları kullanın.">Page not found — use the links above to return to the homepage.</div>
    </div>
  </main>
  <script>/* Dil: ana sitedeki tercih (localStorage 'lang') İngilizceyse metinler İngilizce; alttaki tek satır öteki dilde kalır. */
  (function(){
    var en = false; try { en = localStorage.getItem('lang') === 'en'; } catch (e) {}
    if (!en) return;
    document.documentElement.lang = 'en';
    document.title = 'Page not found (404) — Mehmet Akif Taş';
    document.querySelectorAll('[data-e]').forEach(function (n) { n.textContent = n.getAttribute('data-e'); });
    var o = document.getElementById('other'); if (o) o.lang = 'tr';
  })();
  </script>
  <script>/* Eşyükselti eğrileri (ana sayfanın açılış perdesiyle aynı desen) */
  (function(){
    var g = document.getElementById('topo'); if (!g) return;
    var NS = 'http://www.w3.org/2000/svg', N = 11;
    for (var k = 0; k < N; k++) {
      var R = 286 - k * 25, a = .1, p1 = .6 + k * .23, p2 = 1.9 - k * .31, p3 = 3.1 + k * .17, cx = k * 6.2, cy = -k * 4, d = '';
      for (var t = 0; t < 144; t++) {
        var th = t / 144 * 6.2831853, r = R * (1 + a * Math.sin(2 * th + p1) + a * .55 * Math.sin(3 * th + p2) + a * .3 * Math.sin(5 * th + p3));
        d += (t ? 'L' : 'M') + (cx + r * Math.cos(th)).toFixed(1) + ' ' + (cy + r * Math.sin(th)).toFixed(1);
      }
      var p = document.createElementNS(NS, 'path'); p.setAttribute('d', d + 'Z'); p.setAttribute('pathLength', '1');
      p.style.setProperty('--k', k); if (k % 4 === 0) p.setAttribute('class', 'idx');
      g.appendChild(p);
    }
    var c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', 62); c.setAttribute('cy', -40); c.setAttribute('r', 3.4); g.appendChild(c);
  })();
  </script>
